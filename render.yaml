# Despliegue en Render (Blueprint): New + > Blueprint > elegir este repositorio.
# Los valores marcados con sync: false se completan en el panel de Render (no van al repo).
services:
  - type: web
    name: vulnshop-nova-lab
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # Render pone un proxy delante: con esto se lee la IP real del visitante
      - key: TRUST_PROXY
        value: "1"
      # Solo estas IP (o rangos CIDR) pueden entrar; el resto recibe 403.
      # Ej.: 109.123.252.218,179.6.7.148  (agrega tu rango IPv6 si tu navegador sale por IPv6)
      - key: IPS_PERMITIDAS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODELO
        value: claude-haiku-4-5-20251001
      - key: MAX_TOKENS
        value: "1500"
      - key: NOVA_MAX_CHATS_DIA
        value: "400"
      # Opcionales: cuentas extra del instructor (usuario:DNI:Nombre:Nivel;...)
      - key: CUENTAS_INSTRUCTOR
        sync: false
      - key: PASSWORD_INSTRUCTOR
        sync: false
