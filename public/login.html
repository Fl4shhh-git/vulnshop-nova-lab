<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VulnShop</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body{background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .login-box{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
  .login-box .logo{text-align:center;font-size:1.8rem;font-weight:800;color:#1a1a2e;margin-bottom:6px}
  .login-box .sub{text-align:center;color:#888;font-size:.9rem;margin-bottom:28px}
  .forgot{text-align:right;margin-top:6px;font-size:.82rem}
  .forgot a{color:#888;text-decoration:none}
  .forgot a:hover{color:#4cc9f0}
  .divider{text-align:center;color:#ccc;margin:20px 0;font-size:.82rem}
  .php-error{background:#fdf6e3;border:1px solid #e6d9a8;border-left:4px solid #cc4b37;border-radius:4px;padding:12px 14px;margin-bottom:16px;font-family:'Consolas','Courier New',monospace;font-size:.74rem;color:#586e75;line-height:1.55;text-align:left;overflow-x:auto}
  .php-error b{color:#cc4b37}
  .php-error .q{color:#268bd2;word-break:break-all}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">VulnShop</div>
  <div class="sub">Inicia sesion en tu cuenta</div>

  <div id="alert-box"></div>

  <form id="login-form">
    <label>Correo electronico</label>
    <input type="text" id="email" name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="off">
    <label>Contrasena</label>
    <input type="password" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="off">
    <div class="forgot"><a href="#">Olvidaste tu contrasena?</a></div>
    <br>
    <button type="submit" class="btn btn-primary">Iniciar Sesion</button>
  </form>

  <!-- TODO(jhuaman): sacar antes del pase a produccion. Mientras tanto el equipo de
       soporte entra por /soporte-interno con  soporte / Soporte#2024  (no compartir) -->
  <div class="divider">No tienes cuenta? <a href="#" style="color:#4cc9f0;text-decoration:none">Registrate</a></div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email    = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const alertBox = document.getElementById('alert-box');

  try {
    const res  = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user',  JSON.stringify(data.user));
      alertBox.innerHTML = `<div class="alert alert-success">Bienvenido, <strong>${data.user.username}</strong></div>`;
      setTimeout(() => window.location.href = '/dashboard.html', 800);
    } else if (data.sql_error) {
      const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      alertBox.innerHTML = `<div class="php-error">`
        + `<b>Warning</b>: mysqli::query(): (${esc(data.sqlState)}/${esc(data.errno)}): ${esc(data.message)} in <b>/srv/vulnshop/src/auth.php</b> on line <b>42</b><br><br>`
        + `<b>Fatal error</b>: Uncaught mysqli_sql_exception: ${esc(data.code)}<br>`
        + `Query: <span class="q">${esc(data.query)}</span><br>`
        + `DB: ${esc(data.database)} @ ${esc(data.host)}`
        + `</div>`;
    } else {
      alertBox.innerHTML = `<div class="alert alert-error">Correo o contrasena incorrectos.</div>`;
    }
  } catch(err) {
    alertBox.innerHTML = `<div class="alert alert-error">Error de conexion. Intenta de nuevo.</div>`;
  }
});
</script>
</body>
</html>
