<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VulnShop - Mi Cuenta</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .profile-header{display:flex;align-items:center;gap:24px;margin-bottom:28px}
  .avatar{width:80px;height:80px;border-radius:50%;background:#1a1a2e;color:#4cc9f0;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:800;flex-shrink:0}
  .profile-header-info h2{margin:0 0 4px;font-size:1.4rem}
  .profile-header-info .meta{color:#888;font-size:.88rem}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .info-row{padding:13px 0;border-bottom:1px solid #f0f0f0;display:flex;flex-direction:column;gap:3px}
  .info-row .lbl{font-size:.78rem;color:#aaa;text-transform:uppercase;letter-spacing:.5px}
  .info-row .val{font-size:.95rem;font-weight:600;color:#1a1a2e}
  .order-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #f0f0f0;text-decoration:none;color:inherit}
  .order-row:last-child{border-bottom:none}
  .order-row img{width:52px;height:42px;object-fit:cover;border-radius:6px;border:1px solid #eee;background:#f8f9fa;flex-shrink:0}
  .order-row .oname{font-weight:600;font-size:.9rem}
  .order-row .ometa{font-size:.8rem;color:#888;margin-top:2px}
  .order-row .oprice{font-weight:700;font-size:.95rem;margin-left:auto;flex-shrink:0}
  .Gold{background:#fef9c3;color:#854d0e;padding:4px 14px;border-radius:20px;font-size:.8rem;font-weight:700;display:inline-block}
  .Silver{background:#f1f5f9;color:#475569;padding:4px 14px;border-radius:20px;font-size:.8rem;font-weight:700;display:inline-block}
  .Bronze{background:#fef3f2;color:#9a3412;padding:4px 14px;border-radius:20px;font-size:.8rem;font-weight:700;display:inline-block}
  @media(max-width:600px){.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/dashboard.html" class="brand">VulnShop</a>
  <div class="nav-links">
    <a href="/orders.html">Mis Pedidos</a>
    <a href="/search?q=">Productos</a>
    <a href="/documentos.html">Documentos</a>
    <a href="/membresia.html">Membresia</a>
    <a href="/profile.html">Mi Perfil</a>
    <button class="btn-logout" onclick="logout()">Cerrar sesion</button>
  </div>
</nav>

<div class="container" style="max-width:820px">
  <div id="content"><div style="text-align:center;padding:60px;color:#aaa">Cargando...</div></div>
</div>

<footer>&copy; 2026 VulnShop. Todos los derechos reservados.</footer>

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/login.html';

const params = new URLSearchParams(window.location.search);
let   dni    = params.get('dni');
const FALLBACK = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&q=80';
const STATUS   = { delivered: 'Entregado', shipped: 'En camino', pending: 'Pendiente' };

async function load() {
  if (!dni) {
    const meRes = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
    if (meRes.status === 401) { logout(); return; }
    const me = await meRes.json();
    dni = me.dni;
    history.replaceState(null, '', `/mi-cuenta.html?dni=${dni}`);
  }

  const res = await fetch(`/api/cuenta?dni=${dni}`, { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401) { logout(); return; }
  if (res.status === 404) {
    document.getElementById('content').innerHTML =
      `<div class="card" style="text-align:center;padding:60px;color:#999">
         <h3 style="color:#555">Usuario no encontrado</h3>
         <p>No existe ninguna cuenta con el DNI <strong>${dni}</strong>.</p>
       </div>`;
    return;
  }

  const { perfil: u, pedidos } = await res.json();
  document.title = `VulnShop - ${u.nombre}`;

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="profile-header">
        <div class="avatar">${u.nombre[0]}</div>
        <div class="profile-header-info">
          <h2>${u.nombre}</h2>
          <div class="meta">@${u.username} &nbsp;&middot;&nbsp; <span class="${u.nivel_membresia}">${u.nivel_membresia}</span></div>
        </div>
      </div>
      <div class="info-grid">
        <div class="info-row"><span class="lbl">DNI</span><span class="val">${u.dni}</span></div>
        <div class="info-row"><span class="lbl">Correo electronico</span><span class="val">${u.email}</span></div>
        <div class="info-row"><span class="lbl">Telefono</span><span class="val">${u.telefono}</span></div>
        <div class="info-row"><span class="lbl">Fecha de nacimiento</span><span class="val">${u.fecha_nacimiento}</span></div>
        <div class="info-row"><span class="lbl">Direccion</span><span class="val">${u.direccion}</span></div>
        <div class="info-row"><span class="lbl">Tarjeta registrada</span><span class="val">${u.tarjeta}</span></div>
        <div class="info-row"><span class="lbl">Saldo disponible</span><span class="val">S/ ${u.balance}</span></div>
        <div class="info-row"><span class="lbl">Rol</span><span class="val">${u.role === 'admin' ? 'Administrador' : 'Cliente'}</span></div>
      </div>
    </div>
    <div class="card" style="margin-top:0">
      <h2 style="margin-bottom:16px">Historial de pedidos</h2>
      ${pedidos.length
        ? pedidos.map(o => `
            <a href="/order-detail.html?id=${o.id}" class="order-row">
              <img src="${o.image || FALLBACK}" alt="${o.product}" onerror="this.src='${FALLBACK}'">
              <div>
                <div class="oname">${o.product}</div>
                <div class="ometa">Pedido #${o.id} &middot; <span class="badge badge-${o.status}">${STATUS[o.status] || o.status}</span></div>
              </div>
              <div class="oprice">S/ ${o.price.toFixed(2)}</div>
            </a>`).join('')
        : '<p style="color:#999">Sin pedidos registrados.</p>'
      }
    </div>`;
}

function logout() {
  fetch('/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
  localStorage.clear();
  window.location.href = '/login.html';
}

load();
</script>
<script src="/assets/js/main.4f2a9c.js"></script>
<script src="/nova-widget.js"></script>
</body>
</html>
