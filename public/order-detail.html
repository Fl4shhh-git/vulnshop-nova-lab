<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VulnShop - Detalle del Pedido</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .product-hero{display:flex;gap:32px;align-items:flex-start;margin-bottom:28px}
  .product-hero img{width:260px;height:200px;object-fit:cover;border-radius:12px;border:1px solid #eee;flex-shrink:0;background:#f8f9fa}
  .product-hero-info{flex:1}
  .product-hero-info h3{font-size:1.4rem;font-weight:700;margin-bottom:6px}
  .product-hero-info .brand{font-size:.85rem;color:#888;margin-bottom:12px}
  .product-hero-info .price{font-size:1.8rem;font-weight:800;color:#1a1a2e;margin-bottom:16px}
  .detail-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:.92rem}
  .detail-row:last-child{border-bottom:none}
  .detail-label{color:#888;font-weight:500}
  .detail-value{color:#1a1a2e;font-weight:600;text-align:right}
  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:20px;font-size:.85rem;font-weight:600}
  .status-delivered{background:#d1fae5;color:#065f46}
  .status-shipped{background:#dbeafe;color:#1e40af}
  .status-pending{background:#fef3c7;color:#92400e}
  @media(max-width:600px){.product-hero{flex-direction:column}.product-hero img{width:100%;height:220px}}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/dashboard.html" class="brand">VulnShop</a>
  <div class="nav-links">
    <a href="/orders.html">Mis Pedidos</a>
    <a href="/search?q=">Productos</a>
    <a href="/profile.html">Mi Perfil</a>
    <button class="btn-logout" onclick="logout()">Cerrar sesion</button>
  </div>
</nav>

<div class="container" style="max-width:780px">
  <div style="margin-bottom:16px">
    <a href="/orders.html" style="color:#3182ce;font-size:.9rem">&larr; Volver a mis pedidos</a>
  </div>
  <div id="content"><div style="text-align:center;padding:60px;color:#aaa">Cargando...</div></div>
</div>

<footer>&copy; 2026 VulnShop. Todos los derechos reservados.</footer>

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/login.html';

const params  = new URLSearchParams(window.location.search);
const orderId = params.get('id');
if (!orderId) window.location.href = '/orders.html';

const STATUS_LABELS = { delivered: 'Entregado', shipped: 'En camino', pending: 'Pendiente' };
const FALLBACK = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80';

async function load() {
  const res = await fetch(`/api/orders/${orderId}`, { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401) { logout(); return; }
  if (res.status === 404) {
    document.getElementById('content').innerHTML =
      `<div class="card" style="text-align:center;padding:80px 20px;color:#999">
         <div style="font-size:3rem;margin-bottom:12px">&#128230;</div>
         <h3 style="color:#555">Pedido no encontrado</h3>
         <p>El pedido #${orderId} no existe.</p>
       </div>`;
    return;
  }
  const data = await res.json();
  const o    = data.order;
  document.title = `VulnShop - Pedido #${o.id}`;

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="product-hero">
        <img src="${o.image || FALLBACK}" alt="${o.product}"
             onerror="this.src='${FALLBACK}'">
        <div class="product-hero-info">
          <div class="brand">${o.brand || ''} &middot; ${o.category || 'Producto'}</div>
          <h3>${o.product}</h3>
          <div class="price">S/ ${o.price.toFixed(2)}</div>
          <span class="status-badge status-${o.status}">${STATUS_LABELS[o.status] || o.status}</span>
        </div>
      </div>
      <div class="detail-row"><span class="detail-label">N&deg; de pedido</span><span class="detail-value">#${o.id}</span></div>
      <div class="detail-row"><span class="detail-label">Direccion de envio</span><span class="detail-value">${o.address}</span></div>
      <div class="detail-row"><span class="detail-label">Total pagado</span><span class="detail-value">S/ ${o.price.toFixed(2)}</span></div>
      <div class="detail-row">
        <span class="detail-label">Estado</span>
        <span class="detail-value"><span class="status-badge status-${o.status}">${STATUS_LABELS[o.status] || o.status}</span></span>
      </div>
    </div>`;
}

function logout() {
  fetch('/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
  localStorage.clear();
  window.location.href = '/login.html';
}

load();
</script>
<script src="/assets/js/main.4f2a9c.js"></script>
<script src="/nova-widget.js"></script>
</body>
</html>
